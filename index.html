<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BGO All Services</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#0b3c6d;--secondary:#1e88e5;--text:#111827;--muted:#6b7280;--border:#dbe4f0;--card:#ffffff}
*{box-sizing:border-box}
body{margin:0;font-family:'Prompt',sans-serif;background:radial-gradient(circle at top,#edf5ff 0%,#f8fbff 35%,#f4f7fb 100%);color:var(--text)}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.app{max-width:640px;margin:0 auto;min-height:100vh;padding-bottom:32px}
header{background:linear-gradient(135deg,#0b3c6d,#1e88e5);color:#fff;padding:24px 18px 28px;border-bottom-left-radius:28px;border-bottom-right-radius:28px;box-shadow:0 14px 30px rgba(11,60,109,.18)}
.header-row{display:flex;align-items:center;gap:14px}
.logo-wrap{width:62px;height:62px;border-radius:20px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.logo-wrap img{width:100%;height:100%;object-fit:cover}
.eyebrow{margin:0;font-size:13px;letter-spacing:.28em;font-weight:700;text-transform:uppercase;opacity:.9}
.header-copy h1{margin:4px 0 0;font-size:24px;line-height:1.2}
.section{padding:18px 16px 0}
.section-title{margin:0 4px 14px;font-size:14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.service-tile,.footer-note,.ad-card{background:#fff;border:1px solid var(--border);border-radius:24px;box-shadow:0 10px 24px rgba(15,23,42,.06)}
.service-tile{padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;min-height:144px;transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;overflow:hidden}
.service-tile:hover,.service-tile:focus-visible{transform:translateY(-2px);box-shadow:0 16px 32px rgba(15,23,42,.10)}
.icon-shell{width:82px;height:82px;border-radius:22px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 14px 24px rgba(15,23,42,.08)}
.icon-shell svg{width:48px;height:48px;display:block}
.tile-label{margin-top:10px;font-size:16px;font-weight:700;line-height:1.25}
.tile-copy,.tile-chip{display:none}
.food .icon-shell{background:linear-gradient(180deg,#fff8de,#ffd977)}
.ride .icon-shell{background:linear-gradient(180deg,#eafff2,#b5f0ca)}
.parcel .icon-shell{background:linear-gradient(180deg,#eef5ff,#c8dbff)}
.admin .icon-shell{background:linear-gradient(180deg,#f7efff,#e7d4ff)}
.ad-card{padding:14px}
.ad-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.ad-hero,.slider-shell{overflow:hidden;border-radius:18px;background:linear-gradient(180deg,#f7fafc,#e7eef7)}
.ad-hero{height:240px}
.ad-hero img{width:100%;height:100%;object-fit:contain;object-position:center center;background:transparent}
.slider-shell{position:relative;height:240px}
.slider-track{display:flex;height:100%;transition:transform .45s ease}
.slide{min-width:100%;position:relative;height:100%}
.slide img{width:100%;height:100%;object-fit:contain;object-position:center center;background:transparent}
.slide-caption{position:absolute;left:12px;right:12px;bottom:12px;padding:8px 10px;border-radius:12px;background:rgba(11,60,109,.78);color:#fff;font-size:12px;line-height:1.4;backdrop-filter:blur(6px)}
.slider-dots{display:flex;justify-content:center;gap:8px;margin-top:12px}.slider-dot{width:8px;height:8px;border-radius:999px;background:#c7d2e2;transition:all .2s ease}.slider-dot.active{width:24px;background:#1e88e5}
.footer-note{margin:18px 4px 0;padding:12px 14px;color:#4b5563;font-size:12px;line-height:1.55;border-style:dashed}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.service-tile{min-height:132px;padding:12px 8px 10px}.icon-shell{width:70px;height:70px;border-radius:18px}.icon-shell svg{width:40px;height:40px}.tile-label{font-size:15px}.header-copy h1{font-size:22px}.logo-wrap{width:56px;height:56px}.ad-row{grid-template-columns:1fr}.ad-hero,.slider-shell{height:180px}.slide-caption{font-size:11px;padding:7px 9px}}
</style>
</head>

<script>
const promoTrack = document.getElementById('promoTrack');
const promoDots = Array.from(document.querySelectorAll('#promoDots .slider-dot'));
let promoIndex = 0;
function renderPromo(index){
  promoTrack.style.transform = `translateX(-${index * 100}%)`;
  promoDots.forEach((dot, i) => dot.classList.toggle('active', i === index));
}
setInterval(() => {
  promoIndex = (promoIndex + 1) % promoDots.length;
  renderPromo(promoIndex);
}, 2600);
</script>
